
workflows:
  jarvis-v3-android:
    name: JARVIS AI V3 Android Build

    max_build_duration: 60

    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check project files
        script: |
          ls -la
          test -f settings.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Build APK
        script: |
          ./gradlew assembleDebug

      - name: Build Play Store AAB
        script: |
          ./gradlew bundleRelease

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/**/*.mapping.txt
