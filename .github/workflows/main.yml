name: AIVO V4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test shared AI backend
        working-directory: proxy
        run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android tests, lint, and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aivo-v4-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    runs-on: ubuntu-latest
    needs: android
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment:
      name: android-release
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check protected release configuration
        id: release_config
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AIVO_PROXY_URL: ${{ vars.AIVO_PROXY_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          configured=0
          for value in \
            "${ANDROID_KEYSTORE_BASE64:-}" \
            "${ANDROID_KEYSTORE_PASSWORD:-}" \
            "${ANDROID_KEY_ALIAS:-}" \
            "${ANDROID_KEY_PASSWORD:-}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing is not configured; production APK/AAB builds were skipped."
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Configure all four Android release signing secrets together."
            exit 1
          fi
          if [[ ! "$AIVO_PROXY_URL" =~ ^https://[^[:space:]]+$ ]] ||
             [[ -z "$GOOGLE_WEB_CLIENT_ID" ]] ||
             [[ ! "$ANDROID_RELEASE_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Configure HTTPS AIVO_PROXY_URL, GOOGLE_WEB_CLIENT_ID, and the 64-character release certificate SHA-256 Actions variables."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Restore signing material to runner temporary storage
        if: steps.release_config.outputs.available == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def escape_property(value):
              escaped = []
              for character in value:
                  if character == "\\":
                      escaped.append("\\\\")
                  elif character == "\t":
                      escaped.append("\\t")
                  elif character == "\n":
                      escaped.append("\\n")
                  elif character == "\r":
                      escaped.append("\\r")
                  elif character == "\f":
                      escaped.append("\\f")
                  elif character == " " or character in "=:#!":
                      escaped.append("\\" + character)
                  elif ord(character) < 0x20 or ord(character) > 0x7e:
                      units = character.encode("utf-16-be")
                      escaped.extend(
                          "\\u" + units[offset:offset + 2].hex()
                          for offset in range(0, len(units), 2)
                      )
                  else:
                      escaped.append(character)
              return "".join(escaped)

          keystore = Path(os.environ["RUNNER_TEMP"]) / "aivo-release.jks"
          data = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          if not data:
              raise SystemExit("Decoded release keystore is empty.")
          keystore.write_bytes(data)
          keystore.chmod(0o600)
          values = {
              "storeFile": str(keystore),
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in values.items()),
              encoding="ascii",
          )
          PY

      - name: Build signed release APK and AAB
        if: steps.release_config.outputs.available == 'true'
        env:
          AIVO_PROXY_URL: ${{ vars.AIVO_PROXY_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify release signatures and package identity
        if: steps.release_config.outputs.available == 'true'
        shell: bash
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          signer_output="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_output"
          actual_fingerprint="$(printf '%s\n' "$signer_output" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' |
            tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" |
            tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::APK signing certificate does not match ANDROID_RELEASE_CERT_SHA256."
            exit 1
          fi
          "$build_tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/aivo-apk-badging.txt"
          grep -Fq "package: name='com.jarvis.ai.v4'" "$RUNNER_TEMP/aivo-apk-badging.txt"
          grep -Fq "versionCode='1' versionName='4.0.0'" "$RUNNER_TEMP/aivo-apk-badging.txt"
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aivo-aab-signature.txt" 2>&1
          if ! grep -qi 'jar verified' "$RUNNER_TEMP/aivo-aab-signature.txt"; then
            cat "$RUNNER_TEMP/aivo-aab-signature.txt"
            echo "::error::AAB signature verification did not report a verified bundle."
            exit 1
          fi

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f keystore.properties "$RUNNER_TEMP/aivo-release.jks"

      - name: Upload release APK
        if: steps.release_config.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aivo-v4-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        if: steps.release_config.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aivo-v4-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows desktop app
        run: dotnet publish windows/Jarvis.Desktop/Jarvis.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows/publish

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-v4-windows
          path: windows/Output/JARVIS-AI-V4-Setup.exe
          if-no-files-found: error
          retention-days: 14
