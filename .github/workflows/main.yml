name: Repository scaffold checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify retained repository files
        run: |
          test -s README.md
          test -s .gitignore
          test -s proxy/worker.js
