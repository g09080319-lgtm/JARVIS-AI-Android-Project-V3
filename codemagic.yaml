# Workflow setup for building Native Android project
workflows:
  jarvis-v3:
    name: JARVIS V3 Android APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Check project structure
        script: |
          echo "Checking Android project..."
          find . -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Install Android SDK 36
        script: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
